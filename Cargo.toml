[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "eb6b4fd17b9af5ecc226546bdd04185391b3e265" }
notify = { git = "https://github.com/zed-industries/notify", rev = "faecbc33db4f59313e5225ef766bfd9e54a54cfd" }
notify-types = { git = "https://github.com/zed-industries/notify", rev = "faecbc33db4f59313e5225ef766bfd9e54a54cfd" }
windows-capture = { git = "https://github.com/zed-industries/windows-capture.git", rev = "f0d6c1b6691db75461b732f6d5ff56eed002eeb9" }

# Zed intentionally hard-codes its application name in this crate. Patch every
# embedded Zed caller to the zmux-owned namespace instead of redirecting only
# the database.
[patch."https://github.com/zed-industries/zed"]
paths = { path = "crates/paths" }

[package]
name = "zmux"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1"
async-channel = "2"
base64 = "0.22"
collections = { workspace = true }
editor = { workspace = true }
gpui = { workspace = true }
settings = { workspace = true }
task = { workspace = true }
terminal = { workspace = true }
terminal_view = { workspace = true }
theme = { workspace = true }
theme_settings = { workspace = true }
util = { workspace = true }
zed_actions = { workspace = true }
workspace = { workspace = true }
project = { workspace = true }
client = { workspace = true }
clock = { workspace = true }
db = { workspace = true }
fs = { workspace = true }
http_client = { workspace = true }
getrandom = "0.3.4"
hmac = "0.12"
language = { workspace = true }
net = { workspace = true }
node_runtime = { workspace = true }
paths = { workspace = true }
session = { workspace = true }
ui = { workspace = true }
uuid = { workspace = true }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smol = "2"
tempfile = "3"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_platform = { workspace = true, features = ["font-kit", "wayland", "x11"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
gpui_platform = { workspace = true }

[dev-dependencies]
async-channel = "2"
gpui = { workspace = true, features = ["test-support"] }
paths = { workspace = true, features = ["test-support"] }
terminal = { workspace = true }

[profile.release]
strip = "symbols"
panic = "abort"
