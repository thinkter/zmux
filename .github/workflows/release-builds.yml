name: Release builds

on:
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run Clippy and the complete cross-platform test suite
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            os: ubuntu-24.04
            artifact: zmux-linux-x86_64
            upload_path: |
              dist/zmux-linux-x86_64.deb
              dist/zmux-linux-x86_64.tar.gz
            macos_deployment_target: ''
            rustflags: ''
          - label: macOS aarch64
            os: macos-15
            artifact: zmux-macos-aarch64
            upload_path: dist/zmux-macos-aarch64*.zip
            macos_deployment_target: '12.0'
            rustflags: ''
          - label: Windows x86_64
            os: windows-2025
            artifact: zmux-windows-x86_64
            upload_path: dist/zmux-windows-x86_64*.msi
            macos_deployment_target: ''
            rustflags: '-C target-feature=+crt-static'
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
      RUSTFLAGS: ${{ matrix.rustflags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Linking several statically-built GPUI binaries in parallel exhausts
      # the hosted runner's default commit limit (os error 1455).
      - name: Expand Windows page file
        if: runner.os == 'Windows'
        uses: al-cheb/configure-pagefile-action@a3b6ebd6b634da88790d9c58d4b37a7f4a7b8708 # v1.4
        with:
          minimum-size: 8GB
          maximum-size: 16GB
          disk-root: 'D:'

      - name: Verify vendored source integrity
        if: runner.os == 'Linux'
        run: bash .github/scripts/verify-vendored.sh

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake curl dbus-x11 desktop-file-utils elfutils \
            gettext-base jq libgtk-3-bin libasound2-dev libfontconfig-dev libgit2-dev \
            libglib2.0-dev libsqlite3-dev libssl-dev libva-dev libvulkan1 \
            mesa-vulkan-drivers libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libzstd-dev lld llvm musl-dev musl-tools pipewire xdg-desktop-portal xvfb

      - name: Verify pinned Rust toolchain
        shell: bash
        run: |
          rustup show
          rustc --version | grep -E '^rustc 1\.95\.0 '

      # Rust and Git dependencies dominate clean builds. Keep one cache per
      # platform on the default branch so manual branch/tag runs can restore it
      # without filling the repository quota with branch-scoped duplicates.
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: release-builds
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            . -> target
            vendor/vte -> vendor/vte/target
            vendor/alacritty_terminal -> vendor/alacritty_terminal/target

      - name: Verify release tag
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "zmux") | .version')"
          test "$GITHUB_REF_NAME" = "v$package_version"

      # Dashboard builds package immediately. Enable full_validation when the
      # source checks are wanted; tagged releases always run every check.
      - name: Check formatting
        if: runner.os == 'Linux' && (inputs.full_validation || startsWith(github.ref, 'refs/tags/v'))
        run: cargo fmt --all -- --check

      - name: Run Clippy
        if: runner.os == 'Linux' && (inputs.full_validation || startsWith(github.ref, 'refs/tags/v'))
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run complete test suite
        if: runner.os != 'Windows' && (inputs.full_validation || startsWith(github.ref, 'refs/tags/v'))
        run: cargo test --locked

      - name: Install cargo-nextest
        if: runner.os == 'Windows' && (inputs.full_validation || startsWith(github.ref, 'refs/tags/v'))
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: cargo-nextest@0.9.140

      # GPUI workspace tests share process-wide Windows/ConPTY state. nextest
      # runs every test in its own process, so state cannot leak between tests.
      - name: Run complete test suite (Windows, isolated)
        if: runner.os == 'Windows' && (inputs.full_validation || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        run: cargo nextest run --locked

      - name: Run vendored terminal tests
        if: runner.os == 'Linux' && (inputs.full_validation || startsWith(github.ref, 'refs/tags/v'))
        run: |
          cargo test --manifest-path vendor/vte/Cargo.toml
          cargo test --manifest-path vendor/alacritty_terminal/Cargo.toml

      - name: Build release binaries
        run: cargo build --release --locked

      - name: Package and smoke-test Linux
        if: runner.os == 'Linux'
        run: bash .github/scripts/package-linux.sh

      - name: Package and smoke-test macOS
        if: runner.os == 'macOS'
        env:
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash .github/scripts/package-macos.sh

      - name: Install pinned WiX toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix --version

      - name: Package and smoke-test Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./.github/scripts/package-windows.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}${{ (runner.os == 'macOS' || runner.os == 'Windows') && !startsWith(github.ref, 'refs/tags/v') && '-unsigned' || '' }}
          path: ${{ matrix.upload_path }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-release.sh
