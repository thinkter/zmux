windows-capture = { git = "https://github.com/zed-industries/windows-capture.git", rev = "f0d6c1b6691db75461b732f6d5ff56eed002eeb9" }

[patch."https://github.com/zed-industries/alacritty"]
alacritty_terminal = { path = "vendor/alacritty_terminal" }

[patch."https://github.com/zed-industries/zed"]
terminal_view = { path = "vendor/terminal_view" }

[package]
name = "zmux"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
default-run = "zmux"

[dependencies]
alacritty_terminal = { path = "vendor/alacritty_terminal" }
anyhow = "1"
async-channel = "2"
collections = { workspace = true }
command_palette = { workspace = true }
editor = { workspace = true }
gpui = { workspace = true }
grammars = { workspace = true, features = ["load-grammars"] }
hmac = "0.12"
settings = { workspace = true }
sha2 = "0.10"
task = { workspace = true }
terminal = { workspace = true }
terminal_view = { workspace = true }
tab_switcher = { workspace = true }
theme = { workspace = true }
theme_settings = { workspace = true }
util = { workspace = true }
vim = { workspace = true }
vim_mode_setting = { workspace = true }
zed_actions = { workspace = true }
workspace = { workspace = true }
project = { workspace = true }
client = { workspace = true }
clock = { workspace = true }
db = { workspace = true }
fs = { workspace = true }
getrandom = "0.3"
git = { workspace = true }
git_ui = { path = "vendor/git_ui", features = ["zmux-core"] }
http_client = { workspace = true }
language = { workspace = true }
node_runtime = { workspace = true }
paths = { workspace = true }
session = { workspace = true }
ui = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
notify-rust = "4.18"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_platform = { workspace = true, features = ["font-kit", "wayland", "x11"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
gpui_platform = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
futures-util = "0.3"
mac-usernotifications = "0.3.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
] }

[dev-dependencies]
async-channel = "2"
gpui = { workspace = true, features = ["test-support"] }
terminal = { workspace = true, features = ["test-support"] }

[profile.release]
strip = "symbols"
panic = "abort"
