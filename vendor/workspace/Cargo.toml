[package]
name = "workspace"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

# This crate is vendored from Zed, where it normally inherits the workspace
# lint policy. Keep the release-relevant subset local so a re-vendor cannot
# silently drop correctness lints or turn upstream style lints into failures.
[lints.rust]
unexpected_cfgs = "allow"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

[workspace]

[lib]
path = "src/workspace.rs"
doctest = false

[features]
test-support = [
    "client/test-support",
    "http_client/test-support",
    "db/test-support",
    "project/test-support",
    "remote/test-support",
    "session/test-support",
    "settings/test-support",
    "gpui/test-support",
    "fs/test-support",
]

[dependencies]
any_vec = "0.14"
agent_settings = { git = "https://github.com/zed-industries/zed", rev = "abbe85a3321bf6cb7f5b241e623d9c2e16c29187" }
anyhow = "1.0.86"
async-recursion = "1.0.0"
client = { git = "https://github.com/zed-industries/zed", rev = "abbe85a3321bf6cb7f5b241e623d9c2e16c29187" }
chrono = { version = "0.4", features = ["serde"] }
clock = { git = "https://github.com/zed-industries/zed", rev = "abbe85a3321bf6cb7f5b241e623d9c2e16c29187" }
collections = { git = "https://github.com/zed-industries/zed", rev = "abbe85a3321bf6cb7f5b241e623d9c2e16c29187" }
component = { git = "https://github.com/zed-industries/zed", rev = "abbe85a3321bf6cb7f5b241e623d9c2e16c29187" }
db = { git = "https://github.com/zed-industries/zed", rev = "abbe85a3321bf6cb7f5b241e623d9c2e16c29187" }
dirs = "6.0"
futures-lite = "1.13"
fs = { git = "https://github.com/zed-industries/zed", rev = "abbe85a3321bf6cb7f5b241e623d9c2e16c29187" }
futures = "0.3.32"
git = { git = "https://github.com/zed-industries/zed", rev = "abbe85a3321bf6cb7f5b241e623d9c2e16c29187" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "abbe85a3321bf6cb7f5b241e623d9c2e16c29187" }
http_client = { git = "https://github.com/zed-industries/zed", rev = "abbe85a3321bf6cb7f5b241e623d9c2e16c29187" }
itertools = "0.14.0"
language = { git = "https://github.com/zed-industries/zed", rev = "abbe85a3321bf6cb7f5b241e623d9c2e16c29187" }
log = { version = "0.4.16", features = ["kv_unstable_serde", "serde"] }
menu = { git = "https://github.com/zed-industries/zed", rev = "abbe85a3321bf6cb7f5b241e623d9c2e16c29187" }
markdown = { git = "https://github.com/zed-industries/zed", rev = "abbe85a3321bf6cb7f5b241e623d9c2e16c29187" }
node_runtime = { git = "https://github.com/zed-industries/zed", rev = "abbe85a3321bf6cb7f5b241e623d9c2e16c29187" }
parking_lot = "0.12.1"
postage = { version = "0.5", features = ["futures-traits"] }
project = { git = "https://github.com/zed-industries/zed", rev = "abbe85a3321bf6cb7f5b241e623d9c2e16c29187" }
remote = { git = "https://github.com/zed-industries/zed", rev = "abbe85a3321bf6cb7f5b241e623d9c2e16c29187" }
